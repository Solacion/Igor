name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust build and test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Fetch piper's prebuilt library
        # piper-phonemize-sys otherwise downloads this into target/, and a partly matching build
        # cache could restore its build output without the library, which then fails to link.
        # The crate reads PIPER_PHONEMIZE_LIB_DIR instead when it is set.
        env:
          ARCHIVE: piper-phonemize-v1.5.9-macos-arm64-static-lib.tar.bz2
          SHA256: 4ed1ca09d558b2af416dd56b305f60f5bc4d7fd643607acb54c3cf40e1b7bcda
        run: |
          dir="$RUNNER_TEMP/piper-phonemize"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$ARCHIVE" \
            "https://github.com/csukuangfj/piper-phonemize/releases/download/v1.5.9/$ARCHIVE"
          echo "$SHA256  $RUNNER_TEMP/$ARCHIVE" | shasum -a 256 -c -
          mkdir -p "$dir"
          tar -xjf "$RUNNER_TEMP/$ARCHIVE" -C "$dir"
          echo "PIPER_PHONEMIZE_LIB_DIR=$dir/lib" >> "$GITHUB_ENV"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Check core dependency boundary
        run: |
          # igor-core must not depend on an MCP library, a provider SDK or the desktop UI.
          # Capture the tree first so a cargo failure fails the step instead of passing silently.
          tree=$(cargo tree -p igor-core --edges normal --prefix none --locked)
          if grep -E '^(rmcp|reqwest|tauri)([-_][a-z0-9_-]+)?[ @]' <<< "$tree"; then
            echo "::error::igor-core depends on a forbidden crate."
            exit 1
          fi

  docs:
    name: Docs build
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm run docs:build

      - name: Check the POS MCP server
        run: pnpm --filter @igor/pos-mcp check
