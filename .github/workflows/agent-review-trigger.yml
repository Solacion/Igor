name: Agent review trigger

# Runs with the pull request's own copy of this file, so it is untrusted. It holds no secrets and only
# records which pull request to review. `agent-review.yml` runs from the default branch and verifies it.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  record:
    name: Record pull request
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write pull request number
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p pr
          echo "$PR" > pr/number

      - name: Upload pull request number
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-review-pr
          path: pr/number
          retention-days: 1
