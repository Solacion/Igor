# Sample IGOR configuration for the example purchasing scenario.
#
# It points only at the fixture MCP servers and needs no credentials to load. Relative paths
# resolve against this file's directory. Build the fixture server first:
#   cargo build -p igor-fixture-server
#
# Provisional: the fixture server arguments and read-tool names follow the planned contracts
# (#25, #27) and will be aligned when those land. `create_draft_order` is agreed.

# Local model through LM Studio's OpenAI-compatible server. No API key needed.
[[providers]]
id = "lm_studio"
kind = "openai_compatible"
base_url = "http://127.0.0.1:1234/v1"
model = "local-model" # Replace with a loaded model that supports native tool calling.

# Anthropic Claude. The key is read from the environment when the provider is used;
# it is never written in this file.
[[providers]]
id = "claude"
kind = "anthropic"
model = "claude-model" # Replace with the demo model (open question in docs/specs/decisions.md).
api_key = { env = "ANTHROPIC_API_KEY" }

[[servers]]
id = "sales"
transport = "stdio"
command = "../target/debug/igor-fixture-server"
args = ["--fixtures", "fixtures/sales"]
# The child gets only these variables from IGOR's environment, plus any set in `env`.
env_allowlist = ["PATH"]
startup_timeout_ms = 10000

[[servers]]
id = "weather"
transport = "stdio"
command = "../target/debug/igor-fixture-server"
args = ["--fixtures", "fixtures/weather"]
env_allowlist = ["PATH"]

# Host classification is the only source of tool permissions. Tools not listed are
# unclassified: hidden from the model and refused if called.
[permissions.sales]
get_sales_history = "read"
get_stock_levels = "read"
create_draft_order = "write"

[permissions.weather]
get_weather_forecast = "read"

[limits]
max_iterations = 10
max_result_bytes = 32768
tool_call_timeout_ms = 30000
