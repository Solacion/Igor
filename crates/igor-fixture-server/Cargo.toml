[package]
name = "igor-fixture-server"
description = "Generic fixture-backed MCP server for IGOR tests and demos."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rmcp = { workspace = true, features = ["server", "transport-io"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std", "macros", "rt-multi-thread", "time", "fs", "sync"] }

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "transport-child-process"] }

[lints]
workspace = true
