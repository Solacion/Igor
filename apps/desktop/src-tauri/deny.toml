# Desktop demo supports macOS only. Keep the core policy in root deny.toml strict.
[graph]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

# Explicit licence policy for the locked Rust workspace, including local GPL crates.
# A new licence needs review; this is not a replacement for distribution notices.
[licenses]
confidence-threshold = 0.95
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    # libbz2-rs-sys, used at build time to unpack sherpa-onnx's native libraries (igor-tts).
    # A BSD-style permissive licence; GPL-compatible.
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
    "GPL-3.0-only",
    # piper-phonemize (espeak-ng phonemes for embedded text-to-speech, igor-tts). Allows use under
    # GPL-3.0-only, the project's licence.
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
# Do not suppress advisories or transitive unmaintained packages for the demo.
unmaintained = "all"
