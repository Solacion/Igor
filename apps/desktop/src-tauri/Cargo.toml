[package]
name = "igor-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
publish = false

# Keep the shell's platform graph separate from the core/CLI workspace and lockfile.
[workspace]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
async-trait = "0.1.89"
igor-config = { path = "../../../crates/igor-config" }
igor-mcp = { path = "../../../crates/igor-mcp" }
igor-provider-anthropic = { path = "../../../crates/igor-provider-anthropic" }
igor-provider-openai = { path = "../../../crates/igor-provider-openai" }
tokio = { version = "1.54.1", features = ["rt", "sync", "time"] }
thiserror = "2.0.21"
serde_json = "1.0.154"
igor-core = { path = "../../../crates/igor-core" }
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "=2.12.4", features = [] }

[dev-dependencies]
igor-core = { path = "../../../crates/igor-core", features = ["testing"] }
tokio = { version = "1.54.1", features = ["macros", "rt", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
