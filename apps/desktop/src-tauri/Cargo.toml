[package]
name = "igor-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
publish = false

# Keep the shell's platform graph separate from the core/CLI workspace and lockfile.
[workspace]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
igor-config = { path = "../../../crates/igor-config" }
igor-core = { path = "../../../crates/igor-core" }
igor-mcp = { path = "../../../crates/igor-mcp" }
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "=2.12.5", features = [] }
tokio = { version = "1.54.1", features = ["sync"] }

[dev-dependencies]
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
